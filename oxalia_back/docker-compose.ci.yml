# Optional CI stack. App runtime stays in docker-compose.yml.
# From oxalia_back:
#   docker compose up -d
#   docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build
#
# Jenkins: http://localhost:8080
# Tests use the same Postgres service and database as the API: db / oxalia

services:
  jenkins:
    build:
      context: ./jenkins
    ports:
      - "8081:8080"
      - "50001:50000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - jenkins_home:/var/jenkins_home
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=true"

volumes:
  jenkins_home:
